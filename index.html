<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zulaikha &amp; Iqbal</title>
<meta name="description" content="Sebuah kisah panjang yang disusun daripada perbualan sebenar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf7f2;
  --ink:#211d18;
  --ink-soft:#5c554b;
  --accent:#a04b3c;
  --hairline:#211d1818;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ---------- Gate ---------- */
#gate{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:2rem 1.5rem;
  background:
    radial-gradient(1000px 520px at 50% -5%, #a04b3c10, transparent 60%),
    var(--paper);
  transition:opacity .9s ease, visibility .9s ease;
}
#gate.out{opacity:0;visibility:hidden;pointer-events:none}

.kicker{
  font-size:.72rem;font-weight:600;letter-spacing:.28em;
  text-transform:uppercase;color:var(--accent);margin-bottom:2rem;
}
.names{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(2.2rem,7vw,4.2rem);line-height:1.1;
  margin-bottom:1.75rem;
}
.names .amp{font-style:italic;color:var(--accent)}
.hint{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(1rem,2.4vw,1.2rem);color:var(--ink-soft);
  max-width:28ch;line-height:1.7;margin-bottom:3rem;
}

#enter{
  appearance:none;border:1px solid #a04b3c55;background:transparent;
  color:var(--accent);font-family:var(--serif);font-style:italic;
  font-size:clamp(1.15rem,3vw,1.45rem);padding:1rem 2.4rem;
  border-radius:99px;cursor:pointer;
  transition:background .35s,color .35s,transform .35s,border-color .35s;
}
#enter:hover,#enter:focus-visible{
  background:var(--accent);color:var(--paper);border-color:var(--accent);
  transform:translateY(-2px);
}
#enter:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#enter:active{transform:translateY(0)}

.footnote{
  position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
  font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap;
}

/* ---------- Story frame ---------- */
#story{
  position:fixed;inset:0;width:100%;height:100%;
  border:0;background:var(--paper);
  opacity:0;visibility:hidden;
  transition:opacity .8s ease .15s, visibility .8s ease .15s;
}
#story.show{opacity:1;visibility:visible}

/* ---------- Mute control ---------- */
#mute{
  position:fixed;bottom:1.25rem;right:1.25rem;z-index:30;
  width:2.6rem;height:2.6rem;border-radius:50%;
  border:1px solid var(--hairline);background:#faf7f2ee;
  color:var(--ink-soft);cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:.85rem;backdrop-filter:blur(6px);
  transition:color .3s,border-color .3s,opacity .4s;
  opacity:0;
}
#mute.show{display:flex;opacity:1}
#mute:hover,#mute:focus-visible{color:var(--accent);border-color:#a04b3c50}
#mute:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mute[aria-pressed="true"]{color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  #gate,#story,#enter{transition:none}
}
</style>
</head>
<body>

<audio id="bgm" src="satie-gymnopedie-no-1.mp3" loop preload="auto"></audio>

<section id="gate" aria-label="Halaman pembuka">
  <p class="kicker">Kisah</p>
  <h1 class="names">Zulaikha <span class="amp">&amp;</span> Iqbal</h1>
  <p class="hint">Sebelum kisah dimulakan,<br>ada satu soalan untuk saudari.</p>
  <button type="button" id="enter">Dah Bersediakah Saudari?</button>
  <p class="footnote">Erik Satie · Gymnopédie No. 1</p>
</section>

<iframe id="story" title="Kisah Zulaikha dan Iqbal" src="about:blank" tabindex="-1"></iframe>

<button type="button" id="mute" aria-label="Senyapkan muzik" aria-pressed="false" title="Muzik">♪</button>

<script>
(function () {
  var gate = document.getElementById("gate");
  var enter = document.getElementById("enter");
  var story = document.getElementById("story");
  var bgm = document.getElementById("bgm");
  var mute = document.getElementById("mute");
  var started = false;

  bgm.volume = 0.45;

  function start() {
    if (started) return;
    started = true;
    enter.disabled = true;

    var play = bgm.play();
    if (play && typeof play.catch === "function") {
      play.catch(function () {/* autoplay blocked — still open story */});
    }

    story.src = "kisah.html";
    gate.classList.add("out");
    story.classList.add("show");
    mute.classList.add("show");
    mute.setAttribute("aria-pressed", "false");
    mute.textContent = "♪";
    mute.setAttribute("aria-label", "Senyapkan muzik");

    setTimeout(function () {
      gate.setAttribute("hidden", "");
      story.focus();
    }, 950);
  }

  enter.addEventListener("click", start);
  enter.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") start();
  });

  mute.addEventListener("click", function () {
    bgm.muted = !bgm.muted;
    mute.setAttribute("aria-pressed", bgm.muted ? "true" : "false");
    mute.textContent = bgm.muted ? "♭" : "♪";
    mute.setAttribute("aria-label", bgm.muted ? "Hidupkan muzik" : "Senyapkan muzik");
  });
})();
</script>
</body>
</html>
